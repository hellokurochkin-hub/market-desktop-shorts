<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Яндекс Маркет — шортсы, перелистывание</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <div class="artboard" id="artboard">
        <img class="frozen" id="page-a" src="assets/page.png" width="1654" height="900" alt="" />
        <script>
          if (!/^((?!chrome|android).)*safari/i.test(navigator.userAgent)) {
            document.getElementById("page-a").src = "assets/page-4x.png";
          }
        </script>
        <img class="right-page" id="page-b" src="assets/right-2.png" width="455" height="784" alt="" />

        <div class="view" id="view" aria-label="Видео шортса">
          <div class="track" id="track">
            <div class="slide">
              <img src="assets/view.png" width="475" height="784" alt="" />
            </div>
            <div class="slide">
              <img src="assets/view-2.png" width="475" height="784" alt="" />
            </div>
          </div>
          <div class="progress" id="progress" aria-hidden="true">
            <span class="progress-seg"><i></i></span>
            <span class="progress-seg"><i></i></span>
            <span class="progress-seg"><i></i></span>
            <span class="progress-seg"><i></i></span>
          </div>
        </div>

        <button class="hotspot hotspot-up" id="prev" type="button" aria-label="Предыдущее видео"></button>
        <button class="hotspot hotspot-down" id="next" type="button" aria-label="Следующее видео"></button>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
